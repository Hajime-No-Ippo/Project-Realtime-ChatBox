<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="style.css">
  <title>Chat App</title>
  <script defer src="/socket.io/socket.io.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <div class="brand-mark">CB</div>
        <div class="brand-text">
          <p class="brand-name">ChatBox</p>
          <p class="brand-tagline">Real-time messaging, simple and fast.</p>
        </div>
      </div>
      <div class="status" id="status-indicator">Waiting to join</div>
    </header>

    <main class="content">
      <section class="welcome-panel" id="welcome-panel">
        <div class="welcome-card">
          <p class="eyebrow">Welcome</p>
          <h1>Jump into the conversation</h1>
          <p class="lede">Pick a display name and we will drop you into the live chat.</p>
          <form id="name-form" class="name-form">
            <label for="name-input">Display name</label>
            <div class="name-row">
              <input type="text" id="name-input" name="name" placeholder="Alex, Jamie, Guest..." autocomplete="off" required>
              <button type="submit">Enter chat</button>
            </div>
          </form>
        </div>
      </section>

      <section class="chat-panel hidden" id="chat-panel">
        <div class="messages" id="message-container"></div>
        <form class="message-form hidden" id="send-container">
          <input type="text" id="message-input" placeholder="Type your message" autocomplete="off">
          <button type="submit" id="send-button">Send</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>ChatBox demo · Built with Node, Express, and Socket.IO</p>
    </footer>
  </div>
</body>
</html>
